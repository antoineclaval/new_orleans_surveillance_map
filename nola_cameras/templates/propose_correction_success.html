{% extends "base.html" %}

{% block title %}Correction Submitted - New Orleans surveillance map{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 py-16 text-center">
    <div class="bg-green-100 rounded-full w-20 h-20 flex items-center justify-center mx-auto mb-6">
        <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
    </div>

    <h1 class="text-2xl font-bold text-gray-900 mb-4">Thank You!</h1>

    <p class="text-gray-600 mb-8">
        Your correction has been submitted successfully.
        Our team will review it and update the camera record if needed.
    </p>

    <div class="space-y-4">
        <a href="{% url 'map' %}?camera={{ camera.id }}"
           class="inline-block bg-nola-purple text-white px-6 py-3 rounded-lg font-medium hover:bg-purple-700 transition">
            Back to Camera
        </a>

    </div>
</div>
{% endblock %}
